# Healenium self-healing WebDriver config.
# Only read when self-healing is turned on via -Dhealenium.enabled=true
# (see testBase.AuthorityLogin). Requires the Healenium backend service
# (com.epam.healenium/hlm-backend Docker image + its Postgres DB) to be
# running and reachable at hlm.server.url - otherwise driver creation will
# fail, which is exactly why this is opt-in rather than always-on.

hlm.server.url=http://localhost:7878
hlm.healing.enabled=true
hlm.imprv.selector.enabled=false
hlm.score.cap=0.6
